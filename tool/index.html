<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Pages 图床管理</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f4f2fb;
    color: #2d2a3e;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 顶部标题栏 ---------- */
  header {
    background: linear-gradient(135deg, #5b21b6 0%, #7c3aed 45%, #a855f7 100%);
    color: #fff;
    padding: 30px 20px 34px;
    box-shadow: 0 6px 24px rgba(109, 40, 217, .28);
  }
  .header-inner {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .5px;
  }
  header .sub {
    font-size: 13px;
    opacity: .85;
    margin-top: 4px;
  }
  .repo-tag {
    margin-left: auto;
    background: rgba(255, 255, 255, .18);
    border: 1px solid rgba(255, 255, 255, .3);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    backdrop-filter: blur(4px);
  }

  /* ---------- 布局 ---------- */
  main {
    max-width: 1080px;
    margin: -18px auto 0;
    padding: 0 20px 70px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
  }

  .panel {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(76, 29, 149, .08);
  }

  .panel-title {
    font-size: 15px;
    font-weight: 700;
    color: #4c1d95;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #c084fc);
  }

  /* ---------- 表单控件 ---------- */
  input[type="text"], input[type="password"] {
    border: 1px solid #ddd6fe;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
    transition: .2s;
    background: #fbfaff;
    color: #2d2a3e;
    width: 100%;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    border-color: #8b5cf6;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(139, 92, 246, .15);
  }

  .token-row {
    display: flex;
    gap: 10px;
  }

  .btn {
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all .18s;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn:disabled { opacity: .55; cursor: not-allowed; transform: none !important; }

  .btn-primary {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    color: #fff;
    box-shadow: 0 4px 12px rgba(124, 58, 237, .3);
  }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }

  .btn-ghost { background: #f3f0ff; color: #6d28d9; }
  .btn-ghost:hover:not(:disabled) { background: #e9e2ff; }

  .btn-danger { background: #fef2f2; color: #dc2626; }
  .btn-danger:hover:not(:disabled) { background: #fee2e2; }

  /* ---------- 上传区 ---------- */
  .dropzone {
    border: 2px dashed #c4b5fd;
    border-radius: 14px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    background: #faf8ff;
    user-select: none;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: #8b5cf6;
    background: #f3eeff;
    transform: scale(1.005);
  }
  .dropzone .icon { font-size: 34px; line-height: 1; margin-bottom: 10px; }
  .dropzone .main-text { font-size: 15px; font-weight: 600; color: #6d28d9; }
  .dropzone .sub-text { font-size: 12.5px; color: #948fb0; margin-top: 6px; }

  .upload-progress { margin-top: 16px; }
  .bar {
    height: 6px;
    background: #ede9fe;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .bar .fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #8b5cf6, #d946ef);
    transition: width .3s ease;
  }

  .upload-list { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; }
  .upload-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    background: #faf9ff;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid #f1ecff;
  }
  .upload-item .name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #4b4666;
  }
  .badge {
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 999px;
    white-space: nowrap;
    font-weight: 500;
  }
  .badge.pending   { background: #f1f5f9; color: #64748b; }
  .badge.uploading { background: #ede9fe; color: #7c3aed; }
  .badge.success   { background: #dcfce7; color: #16a34a; }
  .badge.error     { background: #fee2e2; color: #dc2626; }

  /* ---------- 图库 ---------- */
  .gallery-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .gallery-head .panel-title { margin: 0; }
  .count {
    font-size: 12.5px;
    color: #948fb0;
    background: #f6f4ff;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .gallery-head .spacer { flex: 1; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .card {
    border: 1px solid #eee9ff;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    display: flex;
    flex-direction: column;
    box-shadow: 0 2px 10px rgba(109, 40, 217, .06);
    transition: all .2s;
  }
  .card:hover {
    box-shadow: 0 8px 24px rgba(109, 40, 217, .16);
    transform: translateY(-2px);
    border-color: #ddd6fe;
  }

  .thumb {
    height: 150px;
    background: #f7f5ff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 6px;
    border-bottom: 1px solid #f3f0ff;
  }
  .thumb img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    border-radius: 6px;
  }
  .thumb.audio-thumb {
    background: linear-gradient(135deg, #f7f4ff, #efe9ff);
    padding: 0 12px;
  }
  .thumb.audio-thumb audio { width: 100%; height: 40px; }
  .thumb .ph { font-size: 12.5px; color: #a8a2c4; }

  .card-body {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .fname {
    font-size: 13px;
    font-weight: 600;
    color: #3b3557;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .link-input {
    font-size: 12px !important;
    padding: 7px 10px !important;
    border-radius: 8px !important;
    border: 1px solid #e6e0ff !important;
    background: #fbfaff !important;
    color: #6d28d9 !important;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    cursor: text;
  }
  .card-actions { display: flex; gap: 6px; margin-top: auto; }
  .card-actions .btn {
    flex: 1;
    padding: 7px 0;
    font-size: 12px;
    border-radius: 8px;
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 20px;
    color: #a8a2c4;
    font-size: 14px;
  }
  .empty .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* ---------- Toast ---------- */
  #toastContainer {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }
  .toast {
    background: #fff;
    color: #3b3557;
    padding: 12px 18px;
    border-radius: 10px;
    box-shadow: 0 8px 28px rgba(60, 30, 120, .18);
    font-size: 13.5px;
    border-left: 4px solid #8b5cf6;
    max-width: 340px;
    word-break: break-all;
    animation: toastIn .25s cubic-bezier(.2, .9, .3, 1.2);
    transition: opacity .3s, transform .3s;
  }
  .toast.success { border-left-color: #22c55e; }
  .toast.error   { border-left-color: #ef4444; }
  .toast.info    { border-left-color: #8b5cf6; }
  .toast.hide { opacity: 0; transform: translateX(30px); }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(30px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  @media (max-width: 520px) {
    .token-row { flex-direction: column; }
    .repo-tag { margin-left: 0; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .thumb { height: 120px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1>🖼️ GitHub Pages 图床</h1>
      <div class="sub">上传 · 管理 · 外链，一站搞定</div>
    </div>
    <div class="repo-tag">douqg/- @ main</div>
  </div>
</header>

<main>

  <!-- Token 设置 -->
  <section class="panel">
    <h2 class="panel-title"><span class="dot"></span>GitHub Token</h2>
    <div class="token-row">
      <input type="password" id="tokenInput" placeholder="粘贴 Personal Access Token（需要 repo 权限）" autocomplete="off" spellcheck="false">
      <button class="btn btn-primary" id="saveToken">保存</button>
    </div>
  </section>

  <!-- 上传区 -->
  <section class="panel">
    <h2 class="panel-title"><span class="dot"></span>上传文件</h2>
    <div class="dropzone" id="dropzone">
      <div class="icon">📤</div>
      <div class="main-text">点击选择文件，或将文件拖拽到此处</div>
      <div class="sub-text">支持图片：jpg / png / gif / webp / svg / bmp / ico　·　音频：mp3 / wav / m4a / ogg / flac / aac</div>
    </div>
    <input type="file" id="fileInput" multiple hidden
           accept=".jpg,.jpeg,.png,.gif,.webp,.svg,.bmp,.ico,.mp3,.wav,.m4a,.ogg,.flac,.aac">

    <div class="upload-progress" id="uploadProgress" hidden>
      <div class="bar"><div class="fill" id="progressFill"></div></div>
      <div class="upload-list" id="uploadList"></div>
    </div>
  </section>

  <!-- 图库 -->
  <section class="panel">
    <div class="gallery-head">
      <h2 class="panel-title"><span class="dot"></span>图库</h2>
      <span class="count" id="countEl">—</span>
      <div class="spacer"></div>
      <button class="btn btn-ghost" id="refreshBtn">🔄 刷新图库</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

</main>

<div id="toastContainer"></div>

<script>
/* =========================================================
 *  配置区（改这里就行）
 * =======================================================*/
const USERNAME  = 'douqg';                 // GitHub 用户名
const REPO      = '-';                     // 仓库名（已改为减号）
const BRANCH    = 'main';                  // 分支
const PAGES_BASE = 'https://douqg.github.io/-/';  // 外链前缀
const TOKEN_KEY = 'gh_pages_token';        // localStorage 里的 key

/* =========================================================
 *  常量 & 工具
 * =======================================================*/
const IMAGE_EXT = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'ico'];
const AUDIO_EXT = ['mp3', 'wav', 'm4a', 'ogg', 'flac', 'aac'];
const ALL_EXT   = [...IMAGE_EXT, ...AUDIO_EXT];

const API = 'https://api.github.com';

let token = localStorage.getItem(TOKEN_KEY) || '';
let files = [];                 // 当前图库文件列表
let existingNames = new Set();  // 用于避免重名

/* ---------- DOM ---------- */
const els = {
  tokenInput:  document.getElementById('tokenInput'),
  saveToken:   document.getElementById('saveToken'),
  dropzone:    document.getElementById('dropzone'),
  fileInput:   document.getElementById('fileInput'),
  uploadProg:  document.getElementById('uploadProgress'),
  progressFill:document.getElementById('progressFill'),
  uploadList:  document.getElementById('uploadList'),
  grid:        document.getElementById('grid'),
  refreshBtn:  document.getElementById('refreshBtn'),
  countEl:     document.getElementById('countEl'),
  toastBox:    document.getElementById('toastContainer')
};

/* ---------- 扩展名判断 ---------- */
function getExt(name) {
  const i = name.lastIndexOf('.');
  return i > 0 ? name.slice(i + 1).toLowerCase() : '';
}
function isImage(name) { return IMAGE_EXT.includes(getExt(name)); }
function isAudio(name) { return AUDIO_EXT.includes(getExt(name)); }
function isSupported(name) { return ALL_EXT.includes(getExt(name)); }

/* ---------- 链接生成 ---------- */
function pageUrlFor(name) {
  return PAGES_BASE + encodeURIComponent(name);
}
function rawUrlFor(name) {
  return `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${encodeURIComponent(name)}`;
}

/* ---------- Toast ---------- */
function toast(msg, type = 'info', duration = 2800) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  els.toastBox.appendChild(el);
  setTimeout(() => {
    el.classList.add('hide');
    setTimeout(() => el.remove(), 320);
  }, duration);
}

/* ---------- 复制 ---------- */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return;
    }
    throw new Error('fallback');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta);
  }
}

/* ---------- 文件转 base64 ---------- */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const res = reader.result;
      const idx = String(res).indexOf(',');
      resolve(String(res).slice(idx + 1));
    };
    reader.onerror = () => reject(reader.error || new Error('读取文件失败'));
    reader.readAsDataURL(file);
  });
}

/* =========================================================
 *  GitHub API 封装
 * =======================================================*/
async function api(path, options = {}) {
  const res = await fetch(API + path, {
    ...options,
    headers: {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });

  if (!res.ok) {
    let msg = `${res.status} ${res.statusText}`;
    try {
      const data = await res.json();
      if (data && data.message) msg = data.message;
    } catch (_) {}
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  if (res.status === 204) return null;
  return res.json();
}

/* ---------- 拉取文件列表（加入时间戳绕过缓存） ---------- */
async function fetchFileList() {
  // t=${Date.now()} 用于强制刷新，避免 GitHub CDN 缓存导致的显示延迟
  const data = await api(`/repos/${USERNAME}/${REPO}/contents?ref=${encodeURIComponent(BRANCH)}&t=${Date.now()}`);
  if (!Array.isArray(data)) return [];
  return data.filter(f => f.type === 'file' && isSupported(f.name));
}

/* ---------- 上传单个文件 ---------- */
async function uploadSingle(file, onStatus) {
  onStatus('uploading');

  const name = pickUniqueName(file.name);
  const content = await fileToBase64(file);

  await api(`/repos/${USERNAME}/${REPO}/contents/${encodeURIComponent(name)}`, {
    method: 'PUT',
    body: JSON.stringify({
      message: `upload: ${name}`,
      content,
      branch: BRANCH
    })
  });

  existingNames.add(name);
  onStatus('success');
  return name;
}

/* ---------- 生成不重名的文件名 ---------- */
function pickUniqueName(original) {
  if (!existingNames.has(original)) return original;

  const dot = original.lastIndexOf('.');
  const base = dot > 0 ? original.slice(0, dot) : original;
  const ext  = dot > 0 ? original.slice(dot) : '';
  const stamp = Date.now().toString(36);

  let candidate = `${base}-${stamp}${ext}`;
  let i = 2;
  while (existingNames.has(candidate)) {
    candidate = `${base}-${stamp}-${i++}${ext}`;
  }
  return candidate;
}

/* ---------- 删除文件 ---------- */
async function deleteRemote(f) {
  await api(`/repos/${USERNAME}/${REPO}/contents/${encodeURIComponent(f.name)}`, {
    method: 'DELETE',
    body: JSON.stringify({
      message: `delete: ${f.name}`,
      sha: f.sha,
      branch: BRANCH
    })
  });
}

/* =========================================================
 *  图库渲染
 * =======================================================*/
function renderGallery() {
  els.grid.innerHTML = '';

  if (!token) {
    els.countEl.textContent = '—';
    els.grid.innerHTML = '<div class="empty"><div class="empty-icon">🔑</div><p>请先在上方设置 GitHub Token</p></div>';
    return;
  }

  if (!files.length) {
    els.countEl.textContent = '0 个文件';
    els.grid.innerHTML = '<div class="empty"><div class="empty-icon">🖼️</div><p>图库还是空的，上传一些文件吧</p></div>';
    return;
  }

  els.countEl.textContent = `共 ${files.length} 个文件`;
  files.forEach(f => els.grid.appendChild(createCard(f)));
}

function createCard(f) {
  const card = document.createElement('div');
  card.className = 'card';

  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  const rawUrl = rawUrlFor(f.name);

  if (isImage(f.name)) {
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = f.name;
    img.src = rawUrl;
    img.onerror = () => {
      thumb.innerHTML = '<span class="ph">预览加载失败</span>';
    };
    thumb.appendChild(img);
  } else {
    thumb.classList.add('audio-thumb');
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.preload = 'none';
    audio.src = rawUrl;
    thumb.appendChild(audio);
  }

  const body = document.createElement('div');
  body.className = 'card-body';

  const nameEl = document.createElement('div');
  nameEl.className = 'fname';
  nameEl.textContent = f.name;
  nameEl.title = f.name;

  const linkInput = document.createElement('input');
  linkInput.type = 'text';
  linkInput.className = 'link-input';
  linkInput.readOnly = true;
  linkInput.value = pageUrlFor(f.name);
  linkInput.title = '点击可全选';
  linkInput.addEventListener('click', () => linkInput.select());

  const actions = document.createElement('div');
  actions.className = 'card-actions';

  const copyBtn = document.createElement('button');
  copyBtn.className = 'btn btn-ghost';
  copyBtn.textContent = '复制';
  copyBtn.addEventListener('click', async () => {
    await copyText(pageUrlFor(f.name));
    toast('外链已复制到剪贴板', 'success');
  });

  const openBtn = document.createElement('button');
  openBtn.className = 'btn btn-ghost';
  openBtn.textContent = '打开';
  openBtn.addEventListener('click', () => {
    window.open(pageUrlFor(f.name), '_blank', 'noopener');
  });

  const delBtn = document.createElement('button');
  delBtn.className = 'btn btn-danger';
  delBtn.textContent = '删除';
  delBtn.addEventListener('click', () => handleDelete(f, delBtn, card));

  actions.append(copyBtn, openBtn, delBtn);
  body.append(nameEl, linkInput, actions);
  card.append(thumb, body);
  return card;
}

/* ---------- 删除交互 ---------- */
async function handleDelete(f, btn, card) {
  if (!confirm(`确定要删除「${f.name}」吗？此操作不可撤销。`)) return;

  btn.disabled = true;
  btn.textContent = '删除中…';
  card.style.opacity = '.55';

  try {
    await deleteRemote(f);
    files = files.filter(x => x.name !== f.name);
    existingNames.delete(f.name);
    toast(`已删除 ${f.name}`, 'success');
    renderGallery();
  } catch (e) {
    toast('删除失败：' + e.message, 'error', 4000);
    btn.disabled = false;
    btn.textContent = '删除';
    card.style.opacity = '1';
  }
}

/* =========================================================
 *  加载图库
 * =======================================================*/
async function loadGallery(showToast = false) {
  if (!token) { renderGallery(); return; }

  els.grid.innerHTML = '<div class="empty"><p>加载中…</p></div>';
  els.countEl.textContent = '…';

  try {
    files = await fetchFileList();
    existingNames = new Set(files.map(f => f.name));
    renderGallery();
    if (showToast) toast(`已加载 ${files.length} 个文件`, 'success');
  } catch (e) {
    if (e.status === 404) {
      files = [];
      existingNames = new Set();
      renderGallery();
      if (showToast) toast('仓库为空或分支不存在', 'info');
    } else {
      els.grid.innerHTML = '';
      els.countEl.textContent = '—';
      els.grid.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><p>加载失败：${escapeHtml(e.message)}</p></div>`;
      toast('加载失败：' + e.message, 'error', 4000);
    }
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/* =========================================================
 *  上传流程
 * =======================================================*/
async function handleFiles(fileList) {
  const all = Array.from(fileList || []);
  if (!all.length) return;

  if (!token) {
    toast('请先设置 GitHub Token', 'error');
    return;
  }

  const accepted = all.filter(f => isSupported(f.name));
  const rejected = all.length - accepted.length;
  if (rejected > 0) toast(`已忽略 ${rejected} 个不支持的文件`, 'info');
  if (!accepted.length) return;

  els.uploadProg.hidden = false;
  els.progressFill.style.width = '0%';
  els.uploadList.innerHTML = '';

  try {
    const latest = await fetchFileList();
    existingNames = new Set(latest.map(f => f.name));
    files = latest;
    renderGallery();
  } catch (_) { /* 忽略，继续上传 */ }

  const total = accepted.length;
  let finished = 0;
  let okCount = 0;

  for (const file of accepted) {
    const badge = addUploadItem(file.name);
    try {
      await uploadSingle(file, (status) => setBadge(badge, status));
      okCount++;
    } catch (e) {
      setBadge(badge, 'error');
      badge.textContent = '失败：' + e.message.slice(0, 28);
      badge.title = e.message;
      toast(`「${file.name}」上传失败：${e.message}`, 'error', 4500);
    }
    finished++;
    els.progressFill.style.width = Math.round((finished / total) * 100) + '%';
  }

  if (okCount > 0) {
    toast(`上传完成：成功 ${okCount} 个，失败 ${total - okCount} 个`,
          okCount === total ? 'success' : 'info', 3500);
    await loadGallery();
  } else {
    toast('全部上传失败，请检查 Token 权限或网络', 'error', 4000);
  }

  setTimeout(() => {
    els.uploadProg.hidden = true;
    els.progressFill.style.width = '0%';
  }, 2200);
}

function addUploadItem(name) {
  const item = document.createElement('div');
  item.className = 'upload-item';

  const nameEl = document.createElement('span');
  nameEl.className = 'name';
  nameEl.textContent = name;
  nameEl.title = name;

  const badge = document.createElement('span');
  badge.className = 'badge pending';
  badge.textContent = '等待中';

  item.append(nameEl, badge);
  els.uploadList.appendChild(item);
  els.uploadList.scrollTop = els.uploadList.scrollHeight;
  return badge;
}

function setBadge(badge, status) {
  badge.className = 'badge ' + status;
  badge.textContent = ({
    uploading: '上传中…',
    success: '✓ 成功',
    error: '✗ 失败'
  })[status] || status;
}

/* =========================================================
 *  事件绑定
 * =======================================================*/
els.tokenInput.value = token;

els.saveToken.addEventListener('click', () => {
  const v = els.tokenInput.value.trim();
  if (!v) {
    localStorage.removeItem(TOKEN_KEY);
    token = '';
    files = [];
    existingNames = new Set();
    renderGallery();
    toast('Token 已清除', 'info');
    return;
  }
  token = v;
  localStorage.setItem(TOKEN_KEY, v);
  toast('Token 已保存', 'success');
  loadGallery();
});

els.tokenInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') els.saveToken.click();
});

els.dropzone.addEventListener('click', () => els.fileInput.click());
els.fileInput.addEventListener('change', e => {
  handleFiles(e.target.files);
  e.target.value = '';
});

['dragenter', 'dragover'].forEach(ev => {
  els.dropzone.addEventListener(ev, e => {
    e.preventDefault();
    e.stopPropagation();
    els.dropzone.classList.add('dragover');
  });
});
['dragleave', 'drop'].forEach(ev => {
  els.dropzone.addEventListener(ev, e => {
    e.preventDefault();
    e.stopPropagation();
    els.dropzone.classList.remove('dragover');
  });
});
els.dropzone.addEventListener('drop', e => {
  handleFiles(e.dataTransfer.files);
});

window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

els.refreshBtn.addEventListener('click', () => {
  if (!token) { toast('请先设置 GitHub Token', 'error'); return; }
  loadGallery(true);
});

/* =========================================================
 *  启动
 * =======================================================*/
renderGallery();
if (token) {
  loadGallery();
} else {
  toast('请先设置 GitHub Token 以开始使用', 'info', 3500);
}
</script>
</body>
</html>
